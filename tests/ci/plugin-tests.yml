name: llm-wiki Plugin Tests

on:
  push:
    paths:
      - 'claude-plugin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'profiles/**'
      - 'plugins/**'
      - 'AGENTS.md'
      - 'README.md'
  pull_request:
    paths:
      - 'claude-plugin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'profiles/**'
      - 'plugins/**'
      - 'AGENTS.md'
      - 'README.md'

jobs:
  structural:
    name: "Layer 1: Structural Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifest
        run: chmod +x tests/test-plugin-validate.sh && ./tests/test-plugin-validate.sh

      - name: Validate docs and version consistency
        run: chmod +x tests/test-docs-consistency.sh && ./tests/test-docs-consistency.sh

      - name: Generate defect fixtures
        run: chmod +x tests/generate-defect-fixtures.sh && ./tests/generate-defect-fixtures.sh

      - name: Run structural tests
        run: chmod +x tests/test-structure.sh && ./tests/test-structure.sh

      - name: Run local CLI lint tests
        run: chmod +x tests/test-local-cli-lint.sh && ./tests/test-local-cli-lint.sh

      - name: Run Morph Compact wrapper tests
        run: chmod +x scripts/morph-compact tests/fixtures/fake-morph-compact-server.py tests/test-morph-compact.sh && ./tests/test-morph-compact.sh

      - name: Run token budget and benchmark protocol tests
        run: chmod +x scripts/benchmark-token-efficiency tests/test-token-benchmarks.sh tests/fixtures/fake-codex-app-server.py tests/fixtures/fake-claude-cli.py && ./tests/test-token-benchmarks.sh

      - name: Verify query-lite profile and DS4 launcher
        run: chmod +x scripts/sync-query-lite-profile.sh scripts/pi-wiki-query scripts/pi-ds4-wiki-query tests/test-query-lite-sync.sh && ./tests/test-query-lite-sync.sh

      - name: Verify Codex plugin sync
        run: chmod +x tests/test-codex-sync.sh && ./tests/test-codex-sync.sh

      - name: Verify OpenCode plugin sync
        run: chmod +x tests/test-opencode-sync.sh && ./tests/test-opencode-sync.sh

      - name: Run session capture tests
        run: chmod +x tests/test-session-capture.sh && ./tests/test-session-capture.sh

      - name: Run session concurrency regression
        run: chmod +x tests/test-session-concurrency.sh && ./tests/test-session-concurrency.sh

  behavioral:
    name: "Layer 2: Behavioral Evals"
    runs-on: ubuntu-latest
    needs: structural
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Promptfoo
        uses: actions/cache@v4
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-v1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare workspace
        run: |
          mkdir -p tests/workspace
          cp -r tests/fixtures/golden-wiki/* tests/workspace/

      - name: Run behavioral evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx promptfoo@latest eval \
            -c tests/promptfooconfig.yaml \
            -o tests/results.json \
            --repeat 3

      - name: Quality gate
        run: |
          FAILURES=$(jq '.results.stats.failures' tests/results.json)
          TOTAL=$(jq '.results.stats.successes + .results.stats.failures' tests/results.json)
          echo "Failures: $FAILURES / Total: $TOTAL"
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::Behavioral evals failed: $FAILURES assertion failures"
            exit 1
          fi

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUCCESSES=$(jq '.results.stats.successes // 0' tests/results.json)
          FAILURES=$(jq '.results.stats.failures // 0' tests/results.json)
          TOTAL=$((SUCCESSES + FAILURES))
          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$((SUCCESSES * 100 / TOTAL))
          else
            PASS_RATE=0
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**Plugin Eval Results**: ${PASS_RATE}% pass rate (${SUCCESSES}/${TOTAL})"
